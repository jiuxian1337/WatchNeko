# %check_name% - 检查名称
# %description% - 检查的介绍
# %vl% - 违规
# %verbose% - 额外信息
# %player% - 玩家名字
# [alert] - 警告的特殊命令
# [webhook] - 警告discord webhook 的特殊命令
# [proxy] - 用于使用(BungeeCord/Velocity)服务器时的警报
Punishments:
    Simulation:
        # 多少秒后重置VL
        remove-violations-after: 300
        # 这个部分将会匹配检查的名字
        # 要关闭掉一个检查就在检查前面加感叹号
        # 例如, !BadPacketsN
        checks:
            - "Simulation"
        # 最大vl:下一次执行需要的vl
        #
        # 这是个例子, 当到达100VL时为了以 "incorrect movement!" 为理由踢出玩家
        # commands:
        # - "100:0 kick %player% incorrect movement!"
        # 后面的数如果使用0就代表只执行一次
        # - "100:50 say %player% is cheating"
        # 在100vl后执行say %player% is cheating,之后的每50vl都执行一次say %player% is cheating
        #
        commands:
            - "1:1 [log]"
            - "50:10 [alert]"
            - "50:10 [webhook]"
            - "50:10 [proxy]"
            - "500:0 kick %player% cheating"
    Timer:
        remove-violations-after: 300
        checks:
            - "Timer"
            - "TimerLimit"
        commands:
