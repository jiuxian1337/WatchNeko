# config.yml - WatchNeko 主要配置
# 源代码链接: https://github.com/jiuxian1337/WatchNeko
# 基于 Grim (https://github.com/GrimAnticheat/Grim) 修改
# 版权所有 © 2025 DefineOutside 及贡献者 / 遵循 GPLv3 开源协议

alerts:
    # 除了向有权限的玩家发送作弊vl外，是否还在控制台中打印作弊vl消息？
    print-to-console: true
    # 是否在其他子服中发送控制台的作弊信息
    # 如果正在使用Velocity，你必须在Velocity的配置中启用` bungee-plugin-message-channel `。
    proxy:
        # 作弊消息是否应该发送到连接到代理的子服?
        send: true
        # 此服务器是否接收来自其他子服的作弊消息？
        receive: true

    hover:
        enabled: true

    click:
        enabled: true
        command: "/watchneko spectate %player%"

verbose:
    # 是否在控制台中打印verbose信息
    print-to-console: false
# 是否检查更新
check-for-updates: true

client-brand:
    # 这意味着如果客户端型号匹配以下正则表达式，它将不会将其客户端版本显示在聊天栏中
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4}$"
        - "^Feather Fabric$"
        - "^labymod$"
    # 把内置攻击距离修改功能的特定 Forge 版本列入黑名单（Forge 1.18.2 至 1.19.3），这些版本的玩家将无法进入服务器。
    # 将此选项设置为 false 将允许上述客户端连接服务器。禁用此选项需自行承担风险（建议打开）。
    disconnect-blacklisted-forge-versions: true

spectators:
    # 将拥有 watchneko.spectator 权限的人进行隐藏,不管他是否在观察玩家
    hide-regardless: false
    # 观察者在这些世界不会隐藏
    allowed-worlds:
        - ""

# 在玩家无法接收 WatchNeko的 transaction 数据包后,多少秒对玩家进行踢出
# 踢出原因为: disconnect.timeout
# 玩家超时踢出时间（默认 = 60 秒）
max-transaction-time: 60

# Enable this to stop cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# 是否对重复的移动数据包进行撤销?
# 这可以修复 "bucket desync". https://bugs.mojang.com/browse/MC-12363,不过Mojang已经在1.21修复了这个问题
# 这仅仅适用于1.8服务器中使用1.17-1.20.5版本的玩家
cancel-duplicate-packet: true

# 是否忽视重复的数据包中的玩家转头
ignore-duplicate-packet-rotation: false

mitigate-damage:
    enabled: true

Simulation:
    # 当玩家合法时，我们应该将总优势乘以多少
    # 这是默认配置的样子（x 轴 = seconds ，y 轴 = 1/1000 方块）: https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # 玩家移动偏移量判定阈值（单位：方块）
    # 已针对 Optifine 优化三角函数表，若设为 0.001 可减少 FastMath 误报
    # 如果此补偿不起作用，则反作弊记录此玩家作弊
    threshold: 0.03
    # 在玩家受到回弹之前，1 ticks 的判定阈值
    # 假设作弊者与模拟移动的阈值（threshold）是0.0945，该项目设置的是0.07，玩家会立即被回弹到合适的位置
    # -1 关闭
    immediate-setback-threshold: -1
    # 在玩家受到回弹之前，累计回弹的阈值
    # 假设作弊者与模拟移动的阈值（threshold）是0.0945，并且触发了10次，应为0.9450
    # 而你设置的值为0.94 ， 作弊者会受到回弹
    # -1 关闭
    max-advantage: 3
    # 在默认配置的50秒后，玩家将从4块跑到1块
    # 这是为了防止玩家收集过多的违规行为，并且永远无法清除所有的违规行为
    # 这是默认配置的样子（x 轴 = seconds ，y 轴 = 1/1000 方块）: https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # 设置回退的违规等级阈值
    # 1 为旧行为
    setback-violation-threshold: 1

# 检查玩家是否穿墙
Phase:
    setbackvl: 1 # 错误的方块可以允许爬墙，加上这个检查是相对稳定的
    decay: 0.005

NoFallB:
    # 忽略传送带来的 FallDistance 重置；如果玩家莫名其妙摔伤，请改为 true 并在 GitHub 提交 issue。
    ignore-teleport: false

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

ScaffoldA:
    # 低 CPS 的 GodBridge/KeepY
    cancelvl: 5
    # 达到 cancelvl 后，持续取消后续方块放置的时间（毫秒）
    cancel-for-ms: 500

ScaffoldB:
    # 检查放置时是否明显没有朝向支撑方块面
    angle: true
    time:
        # 检查低头连续搭路时放块间隔是否过快
        active: false
        # 低于该平均放置间隔(单位: tick)时开始判定
        average: 2
    # 检查玩家在冲刺后短时间内向下放块
    sprint: true
    rotate:
        # 检查放置后的下一 tick 是否出现过大的水平转向变化
        active: true
        # 触发判定所需的最小偏航差值
        difference: 90
    # 检查放置后的下一 tick 是否切换了快捷栏槽位
    tool-switch: true
    cancelvl: 10
    # 达到 cancelvl 后，持续取消后续方块放置的时间（毫秒）
    cancel-for-ms: 500

ScaffoldC:
    cancelvl: 5
    cancel-for-ms: 500

ScaffoldD:
    cancelvl: 5
    cancel-for-ms: 500

# 使用模拟移动进行的NoSlow(使用物品时不会减速)检查
# 对服务端自身的网络抖动做了容错，反复右键和副手也不会误判。
NoSlowA:
    # 有多少偏移量是作弊
    # 标志 0.03-0.2 与 NoSlow 一致
    threshold: 0.01
    # 到达多少VL时回弹
    setbackvl: 0
    # 当玩家使用一个物品并被它减慢时衰减多少VL
    decay: 0.25

VelocityA:
    # 当玩家合法时，我们应该将总优势乘以多少
    setback-decay-multiplier: 0.999
    # 我们应该为玩家的移动创建多大的偏移量？
    # 从可能的移动中以方块为单位测量
    threshold: 0.03
    # 在玩家受到回弹之前，1 ticks 的违规行为有多大？
    # -1 关闭
    immediate-setback-threshold: 0.1
    # 在我们开始遭遇回弹之前，我们的优势有多大?
    # -1 关闭
    max-advantage: 1
    # 这是为了防止玩家收集过多的违规行为，并且永远无法清除所有的违规行为
    max-ceiling: 4

VelocityB:
    threshold: 0.0003
    # 违规多少次后拉回；-1 表示不拉回（不写时默认 10）
    setbackvl: 10

TimerA:
    setbackvl: 10
    # 玩家卡顿时可以累积以供以后使用的毫秒数
    # 如果设置得太高，可能会允许 1.8 快速使用/快速治疗/快速弓箭绕过，120 毫秒似乎是一个很好的平衡
    drift: 120

# 此项是config是用来防止玩家移动与实时差距过大，来限制对 TimerA 平衡机制的滥用。
TimerLimit:
    # 在检查玩家的延迟时对timer balance进行限制, 防止滥用
    # 在合法玩家的延迟超过这个延迟阈值时可能会造成误拉回
    # 填写-1则关闭
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    # 在开始检查玩家时，玩家的移动丢失了多少毫秒数
    drift: 1200

# 与 TimerA 相同的检查方法，但适用于坐骑
VehicleTimer:
    # 实体1.0005 检查
    setbackvl: 10

Reach:
    # 我们应该将碰撞箱扩大多少？ 0.0005 应该检测到 3.0005+ reach
    #
    # 在 1.9-1.18.1（不是 1.18.2）或某些客户端/服务器组合中存在 0.03 距离的增加，因为
    # 协议更改和限制。 对于 1.8 服务器上的 1.7/1.8 客户端，此检查功能最为强大。
    threshold: 0.03
    # 我们应该取消我们知道不可能的命中吗？
    # 3.00-3.03 命中可能会通过，但仍会被标记，因为数据包顺序限制
    block-impossible-hits: true
    # 这将在每个ticks结束时发送一个额外的数据包，以检查作弊的可能性
    # 这会注入服务器的连接列表以在服务器刷新之前发送最终数据包
    # 启用这将增加所有玩家的带宽使用
    # 这不会降低整体服务器性能
    # 启用此功能将捕获更多作弊者。
    # 禁用此功能仍会捕获作弊者，不会导致误报
    # 除非你是专注于 1.8 PvP 的服务器，否则不建议使用这个额外的数据包
    enable-post-packet: false

# Backtrack检测
PingSpoofB:
    cancelvl: 0

PingSpoofC:
    cancelvl: 0

PingSpoofD:
    cancelvl: 0
    # 在叠加基于 ping 的容错前，基础允许的实体待确认事务数。
    base-pending-allowance: 8
    # 将基于 ping 推导出的额外容错限制为最多这么多个 50ms tick。
    max-ping-ticks: 20

InteractA:
    cancelvl: 0

InteractB:
    cancelvl: 0

# 连点器
AutoclickerA:
    # 收集挥手延迟 ticks=(ms/50)，大于等于该值不计入
    max-delay-ticks: 25
    # 收集多少个样本后开始分析
    stack-size: 100
    # 每个窗口的样本数（用于峰度/熵分析）
    window-size: 20
    # 需要最近有移动包活动
    require-move-within-ms: 500
    # 需要最近有攻击包
    require-attack-within-ms: 7000
    # 熵 jiff delta 阈值
    entropy-jiff-min: 0.04
    entropy-jiff-max: 0.06

AimG:
    # 在存在有效水平转动时，检测连续下压式的极小 pitch 平滑。
    max-streak: 12
    vl-for-streak: 2

AimK:
    # 检测窗口内极小旋转过多且平均转动过低的异常平滑模式。
    minimum-level-threshold: 90

AimS:
    # 检测一段窗口内 yaw 远强于 pitch 的异常比例模式。
    buffer: 7
    min-deltaX: 1.0
    max-deltaY: 0.0001
    ratio-threshold: 1000.0
    window-size: 5

AnalysisA:
    # 云端旋转检测。插件只负责采样与特征提取，判定由云端给出。
    # 云端裁决只累加 VL——是否真的惩罚仍由本文件的 analysis-window-size 与 min-cheat-votes、
    # 以及 punishments 里的 Analysis 组决定。云端超时、报错或不可达时不会产生任何 VL。
    # 首个模型发布之前推理不启用，但 /watchneko record 仍可录制：上传的样本正是训练这个模型用的。
    cloud:
        # 总开关。默认关闭：在你启用并配置好之前，不会向任何地方发送数据。
        enabled: false
        # 云端服务地址，例如 https://cloud.example.com
        endpoint: ""
        # 租户 API key，与 server-id 一起用于认证。
        api-key: ""
        # 本服标识，用于按服统计配额与归属样本。
        server-id: ""
        # 单次请求超时（毫秒）。
        timeout-ms: 2000
    # 攒够多少个样本发一次请求。同一玩家同时最多只有一个请求在途。
    batch-size: 8
    # 投票窗口大小：累计多少个样本裁决后开始判断。
    analysis-window-size: 10
    # 窗口内至少多少个 cheat-like 裁决才告警。
    min-cheat-votes: 8
    # 超出配额时只发送能量不低于此值的窗口；静止窗口不携带任何瞄准信号。
    local-gate-min-energy: 1.25
    # 收到 429 后只发高能量样本的持续时间（毫秒）。
    quota-cooldown-ms: 30000
    # 命中后玩家多少毫秒内打不出伤害。
    mitigate-damage-ms: 5000
    # 把丢样、云端失败等信息打到控制台。
    debug-log: false

# 启发式瞄准检测：看旋转数据本身的形状，每个检测单独调参。
AnalysisB:
    # 随机化缺陷每次命中加多少分。0 表示关闭这条判定。
    randomizer-flaw-add-vl: 25
    # component 分数上限，超过后由 AnalysisC 告警。
    component-vl-limit: 400
    # 每个窗口结束后 component 分数衰减多少。
    component-vl-fade: 5
    # interpolation 分数上限，超过后由 AnalysisD 告警。
    interpolation-vl-limit: 400
    # 每个窗口结束后 interpolation 分数衰减多少。
    interpolation-vl-fade: 5

AnalysisC:
    # 命中后玩家多少毫秒内打不出伤害。
    mitigate-damage-ms: 3500

AnalysisD:
    # 命中后玩家多少毫秒内打不出伤害。
    mitigate-damage-ms: 2500

AnalysisE:
    # 三种常量旋转判定各自的触发阈值，越大越不敏感。
    constant1-need-vl: 8
    constant2-need-vl: 6
    constant3-need-vl: 6
    # 命中后玩家多少毫秒内打不出伤害。
    mitigate-damage-ms: 4000

AnalysisF:
    # 连续多少个样本窗口可疑才触发，越大越不敏感。
    buffer: 2
    # 命中后玩家多少毫秒内打不出伤害。
    mitigate-damage-ms: 4000

AnalysisG:
    # 连续多少个样本窗口出现重复模式才触发，越大越不敏感。
    buffer: 2.5
    # 一个干净窗口后缓冲衰减多少。
    buffer-fade: 0.3
    # 命中后玩家多少毫秒内打不出伤害。
    mitigate-damage-ms: 5000

AnalysisH:
    # 触发所需的证据量，越大越不敏感。
    buffer: 3.0
    # 多少 tick 没有出现大幅旋转后清空缓冲。
    ticks-to-reset: 2500

AnalysisJ:
    # 三种统计判定的缓冲上限，越大越不敏感。
    iqr-vl-limit: 11.0
    zfactor-vl-limit: 7.0
    improbable-vl-limit: 15.0

AnalysisK:
    # 命中后玩家多少毫秒内打不出伤害。0 表示不压低伤害。
    mitigate-damage-ms: 0

AnalysisL:
    # 命中后玩家多少毫秒内打不出伤害。
    mitigate-damage-ms: 5500

AnalysisM:
    # 三种复杂判定的缓冲上限，越大越不敏感。
    entropy-vl-limit: 30
    distinct-vl-limit: 4.0
    randomizer-vl-limit: 2.5

AnalysisN:
    # 命中后玩家多少毫秒内打不出伤害。
    mitigate-damage-ms: 5000

AnalysisO:
    # 命中后玩家多少毫秒内打不出伤害。
    mitigate-damage-ms: 3000

exploit:
    #是否允许玩家在使用鞘翅时候进行的疾跑跳跃
    allow-sprint-jumping-when-using-elytra: true
    # 该选项可在发生鬼块时重新同步玩家，从而减轻玩家在鬼块上的位置。
    # 这可以在玩家遇到幽灵方块时进行同步，这可以减少玩家所碰到幽灵方块
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

# 启用在加入时注入 netty 的日志插件以调试兼容性问题
debug-pipeline-on-join: false

# 启用实验性检查
experimental-checks: false

# 移动预测的全局开关。插件 API 调用方可以在运行时按玩家覆盖。
# 对滑翔中的玩家豁免移动预测（适合装了自定义鞘翅插件的服务器）
exempt-elytra: false
# 即使客户端声称没有卡住，也继续按卡住速度模拟
force-stuck-speed: true
# 即使客户端声称没有被减速，也继续按减速后的移动模拟
force-slow-movement: true

# 取消有问题的格挡
reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true

# 非法的数据包（例如 timer 类作弊）会被取消。一秒钟内取消这么多次后，直接踢掉这个玩家。
# 需要这一项，是因为有些数据包限制器不计算被取消的数据包。
packet-spam-threshold: 100
# 启用此项可在玩家因 packet-spam-threshold 被踢时打印堆栈追踪
debug-packet-cancel: false
# 玩家回复数据包时跳过了多少个 tran/pong 就踢出。
# 高延迟玩家偶尔乱序是正常的，这个值要留出余量；填 -1 关闭。
transaction-skip-limit: 50

# 非飞行状态的玩家 ping 超过这个值会被处理。飞行状态的玩家不做这个判断。
# 填写-1则关闭
max-ping-out-of-flying: 1000

# 限制玩家在使用鞘翅飞行时使用烟花加速的延迟
# 这可以解决高延迟的玩家可以使用鞘翅时一直使用 1 个烟花就可以加速
# 填写-1则关闭
max-ping-firework-boost: 1000

history:
    enabled: true
    # 使用 /watchneko history <player> 时每页显示多少条记录
    entries-per-page: 15
    # history 指令中插入的服务器名称？如果多个服务器共用同一数据库则很有用
    server-name: Prison
    database:
        # 本地存储使用 SQLITE，外部数据库使用 MYSQL。仅在重启服务器后生效
        type: SQLITE
        # MySQL 连接详情
        host: localhost
        port: 3306
        database: grim
        username: root
        password: ""


# 不要修改这一行：插件启动时会把这里写成当前版本的编号。
config-version: 11
