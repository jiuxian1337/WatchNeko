# WatchNeko main configuration
# Source code: https://github.com/jiuxian1337/WatchNeko
# Based on Grim (https://github.com/GrimAnticheat/Grim)
# Copyright 2025 DefineOutside and contributors, Licensed under GPLv3.

alerts:
    # In addition to broadcasting alerts to players, should they also be sent to the console?
    print-to-console: true
    # This controls whether/how alerts are shared between servers connected to your proxy.
    # You must have 'bungee-plugin-message-channel' enabled in your Velocity's configuration if Velocity is in use.
    proxy:
        # Should alerts be sent to other servers connected to your proxy?
        send: true
        # Should the alerts received from other servers be announced to this server?
        receive: true

    hover:
        enabled: true

    click:
        enabled: true
        command: "/watchneko spectate %player%"

verbose:
    print-to-console: false

check-for-updates: true

client-brand:
    # This means it won't broadcast their brand to operators if the brand matches the following regexes
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4}$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Blacklist Forge versions that include built-in Reach hacks (Forge 1.18.2 to 1.19.3).
    # Setting this option to false will allow said clients to connect to the server. Disable this at your own risk.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Hide all spectators with the watchneko.spectator permission regardless if they are actually actively spectating
    hide-regardless: false
    # Will make spectators hidden only in these worlds, keep blank to allow all worlds
    allowed-worlds:
        - ""

# How long should players have until we kick them for timing out? Default = 60 seconds
max-transaction-time: 60

# Enable this to stop cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# Should the duplicate movement packet be cancelled?
# Mojang has fixed this issue in 1.21. This was their attempt to fix the "bucket desync". https://bugs.mojang.com/browse/MC-12363
# This setting only applies to 1.17-1.20.5 clients on 1.8 servers.
cancel-duplicate-packet: true

# Whether or not to ignore the rotation in duplicate packets
ignore-duplicate-packet-rotation: false

mitigate-damage:
    enabled: true

Simulation:
    # How much should we multiply total advantage by when the player is legit
    # This is what the default config looks like (x axis = seconds, y axis = 1/1000 block): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # How large of an offset from the player's movement should we create a violation for?
    # Measured in blocks from the possible movement.
    # Lower values catch more, but also flag players using OptiFine's faster math more often.
    threshold: 0.03
    # How large of a violation in a tick before the player gets immediately setback?
    # -1 to disable
    immediate-setback-threshold: -1
    # How large of an advantage over all ticks before we start to setback?
    # -1 to disable
    max-advantage: 3
    # After 50 seconds with default config, the player will go from 4 blocks -> 1 block of advantage
    # This is to stop the player from gathering too many violations and never being able to clear them all
    # Default advantage ceiling (x axis = seconds, y axis = 1/1000 block): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Violation level threshold for setback
    # 1 for old behavior
    setback-violation-threshold: 1

# Checks to see if a player entered a block during a movement
Phase:
    setbackvl: 1 # Entering blocks can allow wall climbing; this check is stable enough to act early
    decay: 0.005

NoFallB:
    # Ignore FallDistance resets caused by teleports; if players mysteriously take fall damage, set this to true and open an issue on GitHub.
    ignore-teleport: false

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

ScaffoldA:
    # low-CPS GodBridge/KeepY detector
    cancelvl: 5
    # After reaching cancelvl, cancel all block placements for this many milliseconds
    cancel-for-ms: 500

ScaffoldB:
    # Checks if the player is placing while not looking toward the support face
    angle: true
    time:
        # Checks if downward scaffold placements are happening too quickly
        active: false
        # Minimum average interval between placements, in ticks
        average: 2
    # Checks for sprint-assisted downward placements shortly after sprinting
    sprint: true
    rotate:
        # Checks for a large yaw change on the tick after placing
        active: true
        # Minimum yaw difference required to flag
        difference: 90
    # Checks if the player switches hotbar slot on the tick after placing
    tool-switch: true
    cancelvl: 5
    # After reaching cancelvl, cancel all block placements for this many milliseconds
    cancel-for-ms: 500

ScaffoldC:
    cancelvl: 5
    cancel-for-ms: 500

ScaffoldD:
    cancelvl: 5
    cancel-for-ms: 500

# Prediction-based no slow check
# Tolerant of the server's own netcode quirks, so it stays quiet while you spam right click and offhand.
NoSlowA:
    # How much of an offset is "cheating"
    # By default this is lower than other offs
    # Flags by 0.03-0.2 consistently with NoSlow on
    threshold: 0.01
    # Buffer needed before flagging
    buffer-threshold: 5
    # Buffer removed each tick the player is legitimately slowed
    buffer-decay: 0.2
    # Setback fast on the first item to remove any advantage NoSlow gives
    setbackvl: 0
    # Decay's when the player uses an item AND is slowed by it
    decay: 0.25

VelocityA:
    # How much should we multiply total advantage by when the player is legit
    setback-decay-multiplier: 0.999
    # How large of an offset from the player's velocity should we create a violation for?
    # Measured in blocks from the possible velocity
    threshold: 0.03
    # How large of a violation in a tick before the player gets immediately setback?
    # -1 to disable
    immediate-setback-threshold: 0.1
    # How large of an advantage over all ticks before we start to setback?
    # -1 to disable
    max-advantage: 1
    # This is to stop the player from gathering too many violations and never being able to clear them all
    max-ceiling: 4

VelocityB:
    threshold: 0.0003
    # Violations before a setback is applied. -1 disables setback (defaults to 10 when omitted)
    setbackvl: 10

TimerA:
    setbackvl: 10
    # Milliseconds that the player can accumulate for later use when they fall behind
    # Could potentially allow 1.8 fast use/fast heal/fast bow bypasses if set too high, 120 ms seems like a good balance
    drift: 120

# This check limits abuse of the TimerA balance by preventing the player's movement falling too far behind realtime
TimerLimit:
    # Ping at which the check will start to limit timer balance, to prevent abuse.
    # Can cause some setbacks for legitimate players but only if they are over this ping threshold.
    # -1 to disable
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    # Number of milliseconds lost while moving before we should start flagging
    drift: 1200

# Same check method as TimerA, but for vehicles
VehicleTimer:
    # Target 1.005 timer
    setbackvl: 10

Reach:
    # How much should we expand hitboxes by? 0.0005 should detect 3.0005+ reach
    #
    # There is 0.03 forced expansion with 1.9-1.18.1 (not 1.18.2), or some client/server combinations due to
    # protocol changes and limitations. This check is most powerful with 1.7/1.8 clients on 1.8 servers.
    threshold: 0.03
    # Should we cancel hits that we know are impossible?
    # 3.00-3.03 hits may go through but still be flagged, due to packet order limitations
    block-impossible-hits: true
    # This will send an additional packet at the end of every tick to increase the likelihood of catching cheats
    # This injects into server's connection list to send a final packet just before the server flushes
    # Enabling this will increase bandwidth usage for all players
    # This will not decrease overall server performance
    # Enabling this will catch more cheaters.
    # Leaving this disabled will still catch cheaters and will not cause false positives
    # Unless you are a 1.8 PvP focused server, this additional packet is not recommended
    enable-post-packet: false

# Backtrack checks
PingSpoofB:
    cancelvl: 0

PingSpoofC:
    cancelvl: 0

PingSpoofD:
    cancelvl: 0
    # Base number of pending entity transactions allowed before ping-based allowance is added.
    base-pending-allowance: 8
    # Cap the ping-derived allowance at this many 50ms ticks.
    max-ping-ticks: 20

InteractA:
    cancelvl: 0

InteractB:
    cancelvl: 0

# Autoclicker
AutoclickerA:
    # Collect swing delay as ticks=(ms/50), ignore delays >= this
    max-delay-ticks: 25
    # Number of samples before running analysis
    stack-size: 100
    # Per-window sample size for kurtosis/entropy
    window-size: 20
    # Require recent activity (movement packets)
    require-move-within-ms: 500
    # Require recent combat (attack packet)
    require-attack-within-ms: 7000
    # Entropy "jiff delta" thresholds
    entropy-jiff-min: 0.04
    entropy-jiff-max: 0.06

AimG:
    # Consecutive descending micro-pitch pattern after meaningful yaw movement.
    max-streak: 12
    vl-for-streak: 2

AimK:
    # Large windows with too many ultra-small deltas and abnormally low average movement.
    minimum-level-threshold: 90

AimS:
    # Detect windows where yaw dominates pitch with an abnormally high ratio.
    buffer: 7
    min-deltaX: 1.0
    max-deltaY: 0.0001
    ratio-threshold: 1000.0
    window-size: 5

AnalysisA:
    # Cloud-assisted rotation detection. The plugin only samples and extracts features; the verdict comes
    # from the cloud. Cloud verdicts only ever add VL - whether that becomes a punishment is still decided
    # here, by analysis-window-size and min-cheat-votes, plus the Analysis punishments group.
    # A timeout, an error or an unreachable cloud never produces a VL.
    # Before the first model is published, inference stays off but /watchneko record still works: the
    # samples it uploads are what trains that first model.
    cloud:
        # Master switch. Off by default: nothing is sent anywhere until you enable it and configure it.
        enabled: false
        # Cloud service address, e.g. https://cloud.example.com
        endpoint: ""
        # Tenant API key, sent together with server-id to authenticate.
        api-key: ""
        # This server's identity, used for per-server quotas and sample attribution.
        server-id: ""
        # Per-request timeout in milliseconds.
        timeout-ms: 2000
    # How many samples to accumulate before sending. At most one request per player is ever in flight.
    batch-size: 8
    # Voting window: how many sample verdicts to accumulate before judging.
    analysis-window-size: 10
    # How many cheat-like verdicts inside that window are needed to alert.
    min-cheat-votes: 8
    # While over quota, only windows at least this energetic are sent; still windows carry no aim signal.
    local-gate-min-energy: 1.25
    # How long to keep sending only energetic samples after a 429, in milliseconds.
    quota-cooldown-ms: 30000
    # How long the player deals no damage after a flag, in milliseconds.
    mitigate-damage-ms: 5000
    # Print dropped samples and cloud failures to the console.
    debug-log: false

# Heuristic aim checks: they look at the shape of the rotation stream, and are tuned per check.
AnalysisB:
    # Points a randomizer flaw is worth. 0 disables that test.
    randomizer-flaw-add-vl: 25
    # Component score ceiling; AnalysisC alerts once it is crossed.
    component-vl-limit: 400
    # How much the component score fades after each window.
    component-vl-fade: 5
    # Interpolation score ceiling; AnalysisD alerts once it is crossed.
    interpolation-vl-limit: 400
    # How much the interpolation score fades after each window.
    interpolation-vl-fade: 5

AnalysisC:
    # How long the player deals no damage after a flag, in milliseconds.
    mitigate-damage-ms: 3500

AnalysisD:
    # How long the player deals no damage after a flag, in milliseconds.
    mitigate-damage-ms: 2500

AnalysisE:
    # Trigger thresholds for the three constant-rotation tests; higher is quieter.
    constant1-need-vl: 8
    constant2-need-vl: 6
    constant3-need-vl: 6
    # How long the player deals no damage after a flag, in milliseconds.
    mitigate-damage-ms: 4000

AnalysisF:
    # How many sample windows in a row must look suspicious; higher is quieter.
    buffer: 2
    # How long the player deals no damage after a flag, in milliseconds.
    mitigate-damage-ms: 4000

AnalysisG:
    # How many sample windows in a row must contain a repeating pattern; higher is quieter.
    buffer: 2.5
    # How much the buffer decays after a clean window.
    buffer-fade: 0.3
    # How long the player deals no damage after a flag, in milliseconds.
    mitigate-damage-ms: 5000

AnalysisH:
    # Evidence needed to trigger; higher is quieter.
    buffer: 3.0
    # How many ticks without a huge rotation before the buffer is cleared.
    ticks-to-reset: 2500

AnalysisJ:
    # Buffer ceilings for the three statistics verdicts; higher is quieter.
    iqr-vl-limit: 11.0
    zfactor-vl-limit: 7.0
    improbable-vl-limit: 15.0

AnalysisK:
    # How long the player deals no damage after a flag, in milliseconds.
    mitigate-damage-ms: 0

AnalysisL:
    # How long the player deals no damage after a flag, in milliseconds.
    mitigate-damage-ms: 5500

AnalysisM:
    # Buffer ceilings for the three complex verdicts; higher is quieter.
    entropy-vl-limit: 30
    distinct-vl-limit: 4.0
    randomizer-vl-limit: 2.5

AnalysisN:
    # How long the player deals no damage after a flag, in milliseconds.
    mitigate-damage-ms: 5000

AnalysisO:
    # How long the player deals no damage after a flag, in milliseconds.
    mitigate-damage-ms: 3000

exploit:
    # You can gain high speeds when sprint jumping with an elytra, this prevents the exploit when set to false
    # Mojang screwed up netcode by making elytra start client sided and elytra end server sided
    # Elytras take 0.99 horizontal friction, so constantly adding 0.2 horizontal speeds results in very high speeds.
    allow-sprint-jumping-when-using-elytra: true
    # This option mitigates the player's placement on ghostblocks by resynchronizing the player when it happens
    allow-building-on-ghostblocks: true
    # This setting, influenced by the boolean above defines the distance to check for ghost blocks
    # Its valid range is limited from 2 to 4
    distance-to-check-if-ghostblocks: 2

# Enable logging plugins who have injected into netty on join to debug compatibility issues
debug-pipeline-on-join: false

# Enables experimental checks
experimental-checks: false

# Per-player prediction toggles. These are the config-level defaults; a plugin API caller can override
# them per player at runtime.
# Exempt gliding players from the movement prediction (useful for servers with custom elytra plugins)
exempt-elytra: false
# Keep simulating stuck speed even when the client claims it is not stuck
force-stuck-speed: true
# Keep simulating slowed movement even when the client claims it is not slowed
force-slow-movement: true

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true

# Illegal packets (for example from a timer cheat) are cancelled. After this many cancellations in one
# second, kick the player instead. Needed because some packet limiters do not count cancelled packets.
packet-spam-threshold: 100
# Enable this to print a stacktrace when a player is kicked due to packet-spam-threshold
debug-packet-cancel: false
# Kick a player when this many transaction/pong packets were skipped before the reply we received
# (kick reason: invalid skip packet s= <n>). Mojang's client does reorder these under lag, so a very
# high-ping player can be caught; in normal play this only fires for lag-compensation abuse.
# This also closes some lag-compensation bypasses. To disable, use -1
transaction-skip-limit: 50

# Enforce a maximum ping for players who are not in a flying state. Flying players are not checked here.
# To disable, use -1
max-ping-out-of-flying: 1000

# Maximum ping when a firework boost is removed from the player.
# This prevents high latency players from being able to use 1 firework boost with an elytra forever.
max-ping-firework-boost: 1000

history:
    enabled: true
    # How many entries should be shown for each page with /watchneko history <player>
    entries-per-page: 15
    # What should the inserted server name be for the history command? This is useful if you use the same database for multiple servers
    server-name: Prison
    database:
        # Use SQLITE for local storage, use MYSQL if you have an external MySQL database. This is only updated on server restart
        type: SQLITE
        # MySQL connection details
        host: localhost
        port: 3306
        database: grim
        username: root
        password: ""


# Do not edit this line: the plugin rewrites it with the current version on startup.
config-version: 11
